<div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-100" style="max-width: 360px;">
        <h2 class="mb-4 text-center">Login</h2>
        <div class="mb-3">
            <input id="username" type="text" formControlName="username" class="form-control" placeholder="Username">
            @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
            <div class="text-danger small mt-1">Username is required</div>
            }
        </div>
        <div class="mb-3">
            <input id="password" type="password" formControlName="password" class="form-control" placeholder="Password">
            @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <div class="text-danger small mt-1">Password is required</div>
            }
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
</div>
